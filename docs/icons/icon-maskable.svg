<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed for maskable — no rx on background -->
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a6e9e"/>
      <stop offset="100%" stop-color="#1a3550"/>
    </linearGradient>
    <linearGradient id="waterM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5dc8c8"/>
      <stop offset="100%" stop-color="#3a9898"/>
    </linearGradient>
  </defs>

  <!-- Background — full bleed -->
  <rect width="512" height="380" fill="url(#skyM)"/>
  <rect y="370" width="512" height="142" fill="#1a3550"/>

  <!-- Sun -->
  <circle cx="95" cy="85" r="24" fill="#f0c040"/>
  <!-- Moon -->
  <path d="M415 50 Q440 65 440 90 Q440 115 415 128 Q438 116 446 93 Q453 70 438 55 Z" fill="#e8d890" opacity="0.9"/>
  <!-- Stars -->
  <circle cx="393" cy="58" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="468" cy="52" r="2" fill="white" opacity="0.7"/>
  <circle cx="458" cy="74" r="2" fill="white" opacity="0.6"/>

  <!-- Mountains -->
  <polygon points="30,320 165,100 260,245 200,320" fill="#3a5570"/>
  <polygon points="165,100 140,150 165,140 192,150" fill="white" opacity="0.9"/>
  <polygon points="120,320 256,72 390,320" fill="#4a6880"/>
  <polygon points="256,72 224,135 256,125 288,135" fill="white"/>
  <polygon points="290,320 380,130 460,320" fill="#3a5570"/>
  <polygon points="380,130 362,168 380,160 398,168" fill="white" opacity="0.9"/>

  <!-- Trees -->
  <polygon points="42,320 60,272 78,320" fill="#2a5a30"/>
  <polygon points="25,312 44,275 63,312" fill="#336038"/>
  <polygon points="432,320 450,272 468,320" fill="#2a5a30"/>
  <polygon points="448,308 466,268 484,308" fill="#336038"/>

  <!-- Terrain band -->
  <polygon points="200,285 400,225 512,295 512,330 120,330" fill="#c87830" opacity="0.7"/>

  <!-- Train tracks -->
  <g transform="translate(285,198) rotate(-22)">
    <rect x="0" y="0" width="150" height="5" fill="#8a7050" rx="2"/>
    <rect x="0" y="13" width="150" height="5" fill="#8a7050" rx="2"/>
    <rect x="5"  y="-3" width="7" height="21" fill="#6a5040" rx="1"/>
    <rect x="28" y="-3" width="7" height="21" fill="#6a5040" rx="1"/>
    <rect x="51" y="-3" width="7" height="21" fill="#6a5040" rx="1"/>
    <rect x="74" y="-3" width="7" height="21" fill="#6a5040" rx="1"/>
    <rect x="97" y="-3" width="7" height="21" fill="#6a5040" rx="1"/>
    <rect x="120" y="-3" width="7" height="21" fill="#6a5040" rx="1"/>
  </g>

  <!-- Locomotive -->
  <g transform="translate(338,192)">
    <rect x="0" y="8" width="52" height="30" fill="#c84030" rx="4"/>
    <rect x="4" y="12" width="13" height="14" fill="#f8d890" rx="2"/>
    <rect x="50" y="14" width="36" height="20" fill="#b03020" rx="7"/>
    <rect x="74" y="2" width="9" height="13" fill="#5a3020" rx="2"/>
    <rect x="72" y="0" width="14" height="4" fill="#6a4030" rx="1"/>
    <circle cx="79" cy="-5" r="5" fill="#c0c0c0" opacity="0.7"/>
    <circle cx="13" cy="40" r="8" fill="#6a4030" stroke="#8a5040" stroke-width="2"/>
    <circle cx="13" cy="40" r="3.5" fill="#c84030"/>
    <circle cx="34" cy="40" r="8" fill="#6a4030" stroke="#8a5040" stroke-width="2"/>
    <circle cx="34" cy="40" r="3.5" fill="#c84030"/>
    <circle cx="70" cy="40" r="6" fill="#6a4030" stroke="#8a5040" stroke-width="2"/>
  </g>

  <!-- Pool and rocks -->
  <ellipse cx="256" cy="340" rx="138" ry="55" fill="#c87838"/>
  <ellipse cx="256" cy="340" rx="122" ry="46" fill="#d89050"/>
  <ellipse cx="256" cy="336" rx="104" ry="34" fill="url(#waterM)"/>
  <ellipse cx="256" cy="332" rx="76" ry="13" fill="none" stroke="#7adcdc" stroke-width="1.5" opacity="0.4"/>

  <!-- Family figures -->
  <circle cx="210" cy="318" r="15" fill="#f0b090"/>
  <path d="M196 309 Q210 298 224 309" fill="#5a3820"/>
  <circle cx="258" cy="320" r="12" fill="#f0c0a0"/>
  <circle cx="247" cy="310" r="4.5" fill="#8a4020"/>
  <circle cx="269" cy="310" r="4.5" fill="#8a4020"/>
  <circle cx="305" cy="318" r="15" fill="#f0b090"/>
  <path d="M291 306 Q305 295 319 308 Q315 315 305 314 Q296 315 291 306 Z" fill="#5a3020"/>

  <!-- Text -->
  <rect y="372" width="512" height="2" fill="#c87830" opacity="0.4"/>
  <text x="256" y="432" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" fill="white" text-anchor="middle" letter-spacing="2">COLORADO</text>
  <text x="256" y="473" font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#c8d8e8" text-anchor="middle" letter-spacing="4">FAMILY TRIP</text>
</svg>
