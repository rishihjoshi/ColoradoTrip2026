    <line x1="256" y1="85" x2="256" y2="68"/>
    <line x1="256" y1="195" x2="256" y2="212"/>
    <line x1="301" y1="95" x2="313" y2="83"/>
    <line x1="211" y1="95" x2="199" y2="83"/>
    <line x1="311" y1="140" x2="328" y2="140"/>
