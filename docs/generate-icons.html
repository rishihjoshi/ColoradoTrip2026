<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Generating icons... check downloads.</p>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<script>
async function generate(size, filename) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, size, size);
    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = './icons/icon.svg';
}
generate(192, 'icon-192.png');
setTimeout(() => generate(512, 'icon-512.png'), 500);
</script>
</body>
</html>
